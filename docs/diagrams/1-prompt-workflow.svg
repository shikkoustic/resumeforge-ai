<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5A4FCF"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="12" y="22" font-size="14" font-weight="bold" fill="#1F1B2E">Diagram 1 — Prompt workflow</text>

  <rect x="14" y="48" width="130" height="62" rx="9" fill="#F4F2FE" stroke="#C9C0F5"/>
  <text x="79" y="72" font-size="11.5" text-anchor="middle" fill="#1F1B2E">Resume text</text>
  <text x="79" y="88" font-size="11.5" text-anchor="middle" fill="#1F1B2E">+ Job description</text>
  <text x="79" y="103" font-size="9.5" text-anchor="middle" fill="#6B6880">PDF upload or paste</text>

  <line x1="146" y1="79" x2="196" y2="79" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="198" y="40" width="200" height="78" rx="9" fill="#EDE9FD" stroke="#8B7CF6" stroke-width="1.6"/>
  <text x="298" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#3B2F8F">P1 — Gap analysis</text>
  <text x="298" y="77" font-size="10" text-anchor="middle" fill="#4A4660">temperature 0.0 · JSON mode</text>
  <text x="298" y="92" font-size="10" text-anchor="middle" fill="#4A4660">scores on a 5-part rubric</text>
  <text x="298" y="107" font-size="10" text-anchor="middle" fill="#4A4660">analyses only, never rewrites</text>

  <polygon points="440,79 492,52 544,79 492,106" fill="#FFF8EC" stroke="#E8B04B" stroke-width="1.5"/>
  <text x="492" y="76" font-size="10" text-anchor="middle" fill="#7A5A1E">status ==</text>
  <text x="492" y="89" font-size="10" text-anchor="middle" fill="#7A5A1E">invalid_input ?</text>
  <line x1="400" y1="79" x2="438" y2="79" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="492" y1="108" x2="492" y2="156" stroke="#E17055" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="500" y="133" font-size="10" fill="#C0392B">yes</text>
  <rect x="396" y="158" width="195" height="44" rx="9" fill="#FFF5F5" stroke="#F0A9A9"/>
  <text x="493" y="176" font-size="11" text-anchor="middle" fill="#7A3B3B">Refuse: score 0, reason given</text>
  <text x="493" y="192" font-size="9.5" text-anchor="middle" fill="#9B6B6B">P2 is never called</text>

  <line x1="546" y1="79" x2="596" y2="79" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="556" y="70" font-size="10" fill="#2D7D5A">no</text>

  <rect x="598" y="40" width="248" height="78" rx="9" fill="#EDE9FD" stroke="#8B7CF6" stroke-width="1.6"/>
  <text x="722" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#3B2F8F">P2 — Grounded rewriting</text>
  <text x="722" y="77" font-size="10" text-anchor="middle" fill="#4A4660">temperature 0.2 · JSON mode · 2 examples</text>
  <text x="722" y="92" font-size="10" text-anchor="middle" fill="#4A4660">rewrites only the bullets P1 flagged</text>
  <text x="722" y="107" font-size="10" text-anchor="middle" fill="#4A4660">may use only facts already in the resume</text>

  <line x1="722" y1="120" x2="722" y2="228" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="730" y="178" font-size="9.5" fill="#6B6880">rewrites[]</text>
  <line x1="298" y1="120" x2="298" y2="228" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="306" y="178" font-size="9.5" fill="#6B6880">score, gaps, red flags</text>

  <rect x="198" y="230" width="648" height="56" rx="9" fill="#F2FBF7" stroke="#8FD6BA" stroke-width="1.5"/>
  <text x="522" y="251" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E5E47">Combined result rendered in the app</text>
  <text x="522" y="271" font-size="10" text-anchor="middle" fill="#2D6B55">score ring · rubric bars · missing skills with JD evidence · before/after rewrites · red flags · raw JSON</text>

  <text x="14" y="312" font-size="9.5" fill="#6B6880">Two LLM calls per review. P2 runs only when P1 accepts the input, so an invalid resume costs one call instead of two.</text>
</svg>
