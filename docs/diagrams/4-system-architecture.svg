<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5A4FCF"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="12" y="22" font-size="14" font-weight="bold" fill="#1F1B2E">Diagram 4 — System architecture</text>

  <rect x="14" y="40" width="252" height="112" rx="10" fill="#F8F7FE" stroke="#C9C0F5" stroke-dasharray="4 3"/>
  <text x="26" y="58" font-size="10" font-weight="bold" fill="#6B6880">BROWSER</text>
  <rect x="28" y="66" width="224" height="72" rx="8" fill="#EDE9FD" stroke="#8B7CF6"/>
  <text x="140" y="86" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#3B2F8F">Streamlit UI</text>
  <text x="140" y="103" font-size="9.5" text-anchor="middle" fill="#4A4660">code/app.py · code/ui.py</text>
  <text x="140" y="118" font-size="9.5" text-anchor="middle" fill="#4A4660">inputs, score ring, rubric bars,</text>
  <text x="140" y="131" font-size="9.5" text-anchor="middle" fill="#4A4660">rewrite cards, raw JSON</text>

  <line x1="268" y1="96" x2="310" y2="96" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#c)"/>

  <rect x="312" y="40" width="258" height="230" rx="10" fill="#F8F7FE" stroke="#C9C0F5" stroke-dasharray="4 3"/>
  <text x="324" y="58" font-size="10" font-weight="bold" fill="#6B6880">APPLICATION (Streamlit Cloud)</text>

  <rect x="326" y="66" width="230" height="58" rx="8" fill="#EDE9FD" stroke="#8B7CF6"/>
  <text x="441" y="85" font-size="11" font-weight="bold" text-anchor="middle" fill="#3B2F8F">resumeforge.py — engine</text>
  <text x="441" y="101" font-size="9.5" text-anchor="middle" fill="#4A4660">runs P1 then P2, parses JSON</text>
  <text x="441" y="115" font-size="9.5" text-anchor="middle" fill="#4A4660">key + model fallback chain</text>

  <rect x="326" y="132" width="110" height="52" rx="8" fill="#ffffff" stroke="#D9D3F7"/>
  <text x="381" y="150" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F1B2E">resume_io.py</text>
  <text x="381" y="165" font-size="8.5" text-anchor="middle" fill="#6B6880">PDF to text</text>
  <text x="381" y="177" font-size="8.5" text-anchor="middle" fill="#6B6880">encrypted / scan errors</text>

  <rect x="446" y="132" width="110" height="52" rx="8" fill="#ffffff" stroke="#D9D3F7"/>
  <text x="501" y="150" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F1B2E">prompt_loader.py</text>
  <text x="501" y="165" font-size="8.5" text-anchor="middle" fill="#6B6880">reads prompt files</text>
  <text x="501" y="177" font-size="8.5" text-anchor="middle" fill="#6B6880">at run time</text>

  <rect x="326" y="192" width="230" height="64" rx="8" fill="#FFF8EC" stroke="#E8B04B"/>
  <text x="441" y="210" font-size="10" font-weight="bold" text-anchor="middle" fill="#7A5A1E">prompts/ — single source of truth</text>
  <text x="441" y="226" font-size="9" text-anchor="middle" fill="#8A6A2E">final/P1_gap_analysis.txt</text>
  <text x="441" y="239" font-size="9" text-anchor="middle" fill="#8A6A2E">final/P2_bullet_rewrite.txt</text>
  <text x="441" y="251" font-size="8.5" text-anchor="middle" fill="#A08040">the app and the report read the same files</text>

  <line x1="572" y1="96" x2="614" y2="96" stroke="#5A4FCF" stroke-width="1.6" marker-end="url(#c)"/>
  <text x="576" y="89" font-size="8.5" fill="#6B6880">HTTPS</text>

  <rect x="616" y="40" width="230" height="112" rx="10" fill="#F2FBF7" stroke="#8FD6BA"/>
  <text x="628" y="58" font-size="10" font-weight="bold" fill="#2D6B55">GOOGLE AI STUDIO API</text>
  <text x="731" y="82" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E5E47">gemini-3.1-flash-lite</text>
  <text x="731" y="99" font-size="9" text-anchor="middle" fill="#2D6B55">primary · larger free quota</text>
  <text x="731" y="117" font-size="9.5" text-anchor="middle" fill="#2D6B55">falls back to gemini-2.5-flash,</text>
  <text x="731" y="130" font-size="9.5" text-anchor="middle" fill="#2D6B55">then the next key, on HTTP 429</text>

  <rect x="616" y="164" width="230" height="56" rx="8" fill="#FFF5F5" stroke="#F0A9A9"/>
  <text x="731" y="183" font-size="10" font-weight="bold" text-anchor="middle" fill="#7A3B3B">Streamlit Secrets</text>
  <text x="731" y="199" font-size="9" text-anchor="middle" fill="#9B6B6B">GEMINI_API_KEYS, one per member</text>
  <text x="731" y="212" font-size="9" text-anchor="middle" fill="#9B6B6B">never committed to the repository</text>
  <line x1="731" y1="162" x2="731" y2="154" stroke="#C0392B" stroke-width="1.4" marker-end="url(#c)"/>

  <rect x="14" y="290" width="832" height="74" rx="9" fill="#F8F7FE" stroke="#D9D3F7"/>
  <text x="26" y="309" font-size="10.5" font-weight="bold" fill="#1F1B2E">Offline — test harnesses, not part of the running app</text>
  <text x="26" y="327" font-size="9.5" fill="#4A4660">code/run_tests.py — runs the 13 cases in test-data/inputs/, checks for fabricated metrics, writes docs/test-table.md</text>
  <text x="26" y="342" font-size="9.5" fill="#4A4660">code/compare_versions.py — runs v1, v2 and v3 on one input N times, writes docs/iteration-measurements.md</text>
  <text x="26" y="357" font-size="9.5" fill="#6B6880">No database and no user accounts. Nothing a user pastes is stored.</text>
</svg>
